name: e2e
permissions:
  contents: read

on:
  pull_request:
    branches:
      - "*"
    paths:
      - '.github/workflows/e2e.yaml'
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'e2e/**'
      - '.ko.yaml'
      - 'go.*'
      - 'Taskfile.yml'
      - 'devbox.json'
      - 'devbox.lock'
      - '.github/actions/setup/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: Kubernetes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Prepare E2E
        run: |
          echo "127.0.0.1 openbao.openbao.svc.cluster.local" | sudo tee -a /etc/hosts
      - name: e2e testing
        run: devbox run -- task e2e
