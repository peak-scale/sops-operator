name: Test charts
permissions:
  contents: read

on:
  pull_request:
    branches:
      - "*"
    paths:
      - '.github/workflows/helm-*.yml'
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'charts/**'
      - 'e2e/**'
      - '.ko.yaml'
      - 'go.*'
      - 'Taskfile.yml'
      - 'devbox.json'
      - 'devbox.lock'
      - '.github/actions/setup/**'
jobs:
  linter-artifacthub:
    runs-on: ubuntu-latest
    container:
      image: artifacthub/ah@sha256:e5d2a2cdef85aac4928e8176ffaad24746c5fe961d64ff6856f7222957095356
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ah lint
        working-directory: ./charts/
        run: ah lint
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint chart
        run: devbox run -- task helm:lint
      - name: Run docs-testing (helm-docs)
        id: helm-docs
        run: |
          devbox run -- task helm:docs
          if [[ $(git diff --stat) != '' ]]; then
            echo -e '\033[0;31mDocumentation outdated! (Run devbox run -- task helm:docs locally and commit)\033[0m ❌'
            git diff --color
            exit 1
          else
            echo -e '\033[0;32mDocumentation up to date\033[0m ✔'
          fi
      - name: Run schema-testing (helm-schema)
        id: helm-schema
        run: |
          devbox run -- task helm:schema
          if [[ $(git diff --stat) != '' ]]; then
            echo -e '\033[0;31mSchema outdated! (Run devbox run -- task helm:schema locally and commit)\033[0m ❌'
            git diff --color
            exit 1
          else
            echo -e '\033[0;32mSchema up to date\033[0m ✔'
          fi
      - name: Install and test chart
        run: devbox run -- task helm:test
